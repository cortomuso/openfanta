version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: queries
    gen:
      go:
        package: db
        out: db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          # Averages of a player with no voto are NULL; sqlc cannot see that through the view.
          - column: player_season_stats.avg_voto
            go_type:
              type: int32
              pointer: true
          - column: player_season_stats.avg_fantavoto
            go_type:
              type: int32
              pointer: true
