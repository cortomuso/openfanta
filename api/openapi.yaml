openapi: 3.0.3
info:
  title: OpenFanta API
  version: 0.1.0
  description: |
    Read-only access to fantacalcio voti and fantavoti computed by OpenFanta.

    Conventions:
    - IDs are opaque strings (UUIDs). Never rely on their structure.
    - Scores (`voto`, `fantavoto`, breakdown `points`) are **decimal strings with exactly two
      fractional digits**, such as `"6.38"` or `"7.00"`, so no client ever parses a float.
      `voto` is the base voto of the chosen source; rounding is a league setting, and the Classic
      default uses the provider rating unrounded.
    - Rule set bodies are returned as published: point values there are integer hundredths.
    - Errors use RFC 9457 `application/problem+json`.
    - Lists take `limit` (1 to 200) and an opaque `cursor`, and answer `next_cursor` while more
      rows follow. Pass `next_cursor` back as `cursor` for the next page; never build or parse
      one. A request with neither parameter returns the whole list. Order is fixed and documented
      per endpoint, so pages never overlap.
    - Responses carry an `ETag`; send `If-None-Match` to get `304 Not Modified`.
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: http://localhost:8080
tags:
  - name: health
  - name: scores
  - name: catalog
  - name: settings
  - name: leagues
paths:
  /healthz:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness probe
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /readyz:
    get:
      tags: [health]
      operationId: getReady
      summary: Readiness probe (checks the database)
      responses:
        "200":
          description: Ready to serve traffic.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          $ref: "#/components/responses/Problem"

  /v1/settings/default:
    get:
      tags: [settings]
      operationId: getDefaultSettings
      summary: Get the default league settings document (Classic)
      description: Scores are computed under this document until leagues score under their own.
      responses:
        "200":
          description: The document, in canonical JSON, with its hash.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }

  /v1/voto-sources:
    get:
      tags: [settings]
      operationId: listVotoSources
      summary: List the voto sources a league can choose
      description: |
        A league picks one in its settings document (`voto.source`) and, next to it, how the
        voto is rounded (`voto.rounding`: `mode` and `step` in hundredths). The `name` is also
        the `voto_source` of a run and of the score queries.
      responses:
        "200":
          description: The sources, with the one used when a document names none.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VotoSourceList" }

  /v1/leagues/{leagueId}/matchdays/{number}/exceptions:
    put:
      tags: [leagues]
      operationId: putMatchdayExceptions
      summary: Override the real-match policy for fixtures of a matchday
      description: |
        League admins only. For a postponed or suspended real match (or one played outside its
        round window) the league's `real_match` settings say whether its players wait for real
        voti or get an automatic voto. An override replaces that policy for one fixture of this
        matchday; the body lists all overrides of the matchday, so an empty list clears them.
        The policy is applied when the matchday closes and shows in the explain trace.

        **Not served yet:** it needs authentication and league membership (M2) and the matchday
        lifecycle, so for now it answers 501.
      parameters:
        - { name: leagueId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: number, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MatchdayExceptions" }
      responses:
        "200":
          description: The overrides now in force for the matchday.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatchdayExceptions" }
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "501":
          $ref: "#/components/responses/Problem"

  /v1/seasons:
    get:
      tags: [catalog]
      operationId: listSeasons
      summary: List seasons
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Seasons with ingested data, ordered by competition name, then season name (newest first).
          content:
            application/json:
              schema:
                type: object
                required: [seasons]
                properties:
                  seasons:
                    type: array
                    items: { $ref: "#/components/schemas/Season" }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        "400":
          $ref: "#/components/responses/Problem"
  /v1/seasons/{seasonId}/matchdays:
    get:
      tags: [catalog]
      operationId: listMatchdays
      summary: List a season's matchdays and fixtures
      parameters:
        - $ref: "#/components/parameters/SeasonId"
      responses:
        "200":
          description: Matchdays in order.
          content:
            application/json:
              schema:
                type: object
                required: [season, matchdays]
                properties:
                  season: { $ref: "#/components/schemas/Season" }
                  matchdays:
                    type: array
                    items: { $ref: "#/components/schemas/Matchday" }
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/seasons/{seasonId}/matchdays/{number}/scores:
    get:
      tags: [scores]
      operationId: getMatchdayScores
      summary: Voti and fantavoti for every player of a matchday
      parameters:
        - $ref: "#/components/parameters/SeasonId"
        - { name: number, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - $ref: "#/components/parameters/VotoSourceQuery"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Scores, ordered by fixture kickoff, team and player name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScoreList" }
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/seasons/{seasonId}/players/{playerId}/scores:
    get:
      tags: [scores]
      operationId: getPlayerSeasonScores
      summary: A player's voti and fantavoti across a season
      parameters:
        - $ref: "#/components/parameters/SeasonId"
        - $ref: "#/components/parameters/PlayerId"
        - $ref: "#/components/parameters/VotoSourceQuery"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Scores ordered by matchday.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScoreList" }
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/fixtures/{fixtureId}/scores:
    get:
      tags: [scores]
      operationId: getFixtureScores
      summary: Voti and fantavoti for every player of a fixture
      parameters:
        - $ref: "#/components/parameters/FixtureId"
        - $ref: "#/components/parameters/VotoSourceQuery"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Scores ordered by team and player name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScoreList" }
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/fixtures/{fixtureId}/runs:
    get:
      tags: [scores]
      operationId: getFixtureRuns
      summary: Audit trail of every computation of a fixture
      parameters:
        - $ref: "#/components/parameters/FixtureId"
      responses:
        "200":
          description: Runs, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [fixture, runs]
                properties:
                  fixture: { $ref: "#/components/schemas/Fixture" }
                  runs:
                    type: array
                    items: { $ref: "#/components/schemas/Run" }
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/players/{playerId}:
    get:
      tags: [catalog]
      operationId: getPlayer
      summary: Get a player
      description: |
        Club, roles, birth year and status come from the teams' squads and are empty or `unknown`
        for a player the squads never named.
      parameters:
        - $ref: "#/components/parameters/PlayerId"
      responses:
        "200":
          description: The player.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Player" }
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"

  /v1/players:
    get:
      tags: [catalog]
      operationId: listPlayers
      summary: Search and browse players
      description: |
        Ordered by name. Club, role and status are those of the season in `season`, else of each
        player's latest season. `role` and `club` therefore match the squad entry of that season,
        and `season` keeps only players listed in it. Players no squad has named are only found
        without `role`, `club` and `season`. A page is 50 players unless `limit` says otherwise.
        Sorting by statistics comes with the season statistics (#149).
      parameters:
        - { name: q, in: query, description: Case-insensitive text in the name., schema: { type: string, minLength: 1, maxLength: 100 } }
        - { name: role, in: query, schema: { $ref: "#/components/schemas/PlayerRole" } }
        - { name: club, in: query, description: A club id., schema: { type: string, format: uuid } }
        - { name: season, in: query, description: A season id., schema: { type: string, format: uuid } }
        - { name: birth_year_from, in: query, schema: { type: integer, minimum: 1900, maximum: 2100 } }
        - { name: birth_year_to, in: query, schema: { type: integer, minimum: 1900, maximum: 2100 } }
        - { name: sort, in: query, schema: { type: string, enum: [name], default: name } }
        - name: limit
          in: query
          description: Page size, 1 to 200; 50 when omitted.
          schema: { type: integer, minimum: 1, maximum: 200 }
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of players.
          content:
            application/json:
              schema:
                type: object
                required: [players]
                properties:
                  players:
                    type: array
                    items: { $ref: "#/components/schemas/PlayerSummary" }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        "400":
          $ref: "#/components/responses/Problem"
  /v1/clubs:
    get:
      tags: [catalog]
      operationId: listClubs
      summary: List clubs
      description: Clubs are the teams of the ingested competitions, ordered by name.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Clubs.
          content:
            application/json:
              schema:
                type: object
                required: [clubs]
                properties:
                  clubs:
                    type: array
                    items: { $ref: "#/components/schemas/Ref" }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        "400":
          $ref: "#/components/responses/Problem"
  /v1/clubs/{clubId}/players:
    get:
      tags: [catalog]
      operationId: listClubPlayers
      summary: A club's squad in a season
      description: |
        The players the club lists in the season, ordered by name. Players who have left the squad
        are included and flagged `no_longer_listed`, so rules for released players can apply.
        Without `season` the club's latest season with a squad is used.
      parameters:
        - { name: clubId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: season, in: query, description: A season id., schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: The squad. `season` is null for a club that has no squad yet.
          content:
            application/json:
              schema:
                type: object
                required: [club, season, players]
                properties:
                  club: { $ref: "#/components/schemas/Ref" }
                  season:
                    allOf: [{ $ref: "#/components/schemas/Season" }]
                    nullable: true
                  players:
                    type: array
                    items: { $ref: "#/components/schemas/SquadPlayer" }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"

components:
  parameters:
    SeasonId:
      { name: seasonId, in: path, required: true, schema: { type: string, format: uuid } }
    PlayerId:
      { name: playerId, in: path, required: true, schema: { type: string, format: uuid } }
    FixtureId:
      { name: fixtureId, in: path, required: true, schema: { type: string, format: uuid } }
    Limit:
      name: limit
      in: query
      description: Page size, 1 to 200. Without `limit` and `cursor` the whole list is returned.
      schema: { type: integer, minimum: 1, maximum: 200 }
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` of the previous page.
      schema: { type: string }
    VotoSourceQuery:
      name: voto_source
      in: query
      description: Where base voti come from.
      schema: { type: string, default: provider-rating }
  responses:
    Problem:
      description: An error, as RFC 9457 problem details.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    MatchdayExceptions:
      type: object
      required: [overrides]
      properties:
        overrides:
          type: array
          items: { $ref: "#/components/schemas/ExceptionOverride" }
    ExceptionOverride:
      type: object
      required: [fixture_id, policy]
      properties:
        fixture_id: { type: string, format: uuid }
        policy:
          type: string
          enum: [wait, automatic_voto]
          description: "`wait` leaves the players without a voto until the match is played; `automatic_voto` gives everyone involved the voto."
        voto:
          type: string
          pattern: '^(10(\.00)?|[0-9](\.[0-9]{2})?)$'
          nullable: true
          description: The automatic voto, as a two-decimal string. Omit to use the league's `real_match.automatic_voto`.
          example: "6.00"
    VotoSourceList:
      type: object
      required: [default, sources]
      properties:
        default: { type: string, example: provider-rating }
        sources:
          type: array
          items: { $ref: "#/components/schemas/VotoSource" }
    VotoSource:
      type: object
      required: [name, version, description]
      properties:
        name: { type: string, example: provider-rating }
        version: { type: string, description: Identifies the parameters; a change makes a new run., example: "1" }
        description: { type: string }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, example: ok }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, example: about:blank }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    NextCursor:
      type: string
      description: Present when more rows follow; pass it as `cursor` to get them.
    Decimal:
      type: string
      pattern: "^-?[0-9]+\\.[0-9]{2}$"
      example: "6.38"
    Ref:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    PlayerRole:
      type: string
      enum: [P, D, C, A]
      description: The role catalog, as listed on a listone. P goalkeeper, D defender, C midfielder, A attacker.
    PlayerStatus:
      type: string
      enum: [listed, no_longer_listed, unknown]
      description: |
        `listed` while the latest squad entry is open, `no_longer_listed` once the player has
        left the club's squad (rules for released players apply), `unknown` for a player no
        squad has named.
    SquadPlayer:
      type: object
      required: [player, roles, birth_year, status]
      properties:
        player: { $ref: "#/components/schemas/Ref" }
        roles:
          type: array
          items: { $ref: "#/components/schemas/PlayerRole" }
        birth_year: { type: integer, nullable: true }
        status: { $ref: "#/components/schemas/PlayerStatus" }
    PlayerSummary:
      type: object
      required: [id, name, roles, club, birth_year, status]
      properties:
        id: { type: string }
        name: { type: string }
        roles:
          type: array
          items: { $ref: "#/components/schemas/PlayerRole" }
        club:
          allOf: [{ $ref: "#/components/schemas/Ref" }]
          nullable: true
        birth_year: { type: integer, nullable: true }
        status: { $ref: "#/components/schemas/PlayerStatus" }
    ClubSeason:
      type: object
      required: [season, club, roles, status]
      properties:
        season:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string, example: 2026/2027 }
        club: { $ref: "#/components/schemas/Ref" }
        roles:
          type: array
          items: { $ref: "#/components/schemas/PlayerRole" }
        status: { $ref: "#/components/schemas/PlayerStatus" }
    Player:
      type: object
      required: [id, name, roles, club, club_history, birth_year, status]
      properties:
        id: { type: string }
        name: { type: string }
        roles:
          type: array
          items: { $ref: "#/components/schemas/PlayerRole" }
          description: |
            Listed roles, most important first. Empty when the provider gives none. The provider
            lists one position per player, so a dual-role player has two entries only once another
            source or a league override says so.
        club:
          allOf: [{ $ref: "#/components/schemas/Ref" }]
          nullable: true
          description: The team the player is listed with in their latest season; null when unknown.
        birth_year:
          type: integer
          nullable: true
          description: Null when the provider does not give a birth date.
        status: { $ref: "#/components/schemas/PlayerStatus" }
        club_history:
          type: array
          items: { $ref: "#/components/schemas/ClubSeason" }
          description: The club the player was listed with in each season, latest first. Empty when no squad named the player.
    Season:
      type: object
      required: [id, name, competition]
      properties:
        id: { type: string }
        name: { type: string, example: 2026/2027 }
        competition:
          type: object
          required: [id, name, country]
          properties:
            id: { type: string }
            name: { type: string }
            country: { type: string }
    Fixture:
      type: object
      required: [id, matchday, status, home, away]
      properties:
        id: { type: string }
        matchday: { type: integer }
        kickoff: { type: string, format: date-time, nullable: true }
        status: { type: string, description: "Provider status, e.g. FT" }
        exception:
          type: string
          enum: [postponed, suspended]
          nullable: true
          description: Set when the real match was postponed or suspended; the league's real-match policy applies to it.
        home: { $ref: "#/components/schemas/Ref" }
        away: { $ref: "#/components/schemas/Ref" }
    Matchday:
      type: object
      required: [number, fixtures]
      properties:
        number: { type: integer }
        fixtures:
          type: array
          items: { $ref: "#/components/schemas/Fixture" }
    BreakdownItem:
      type: object
      required: [code, count, points]
      properties:
        code: { type: string, example: goal, description: "A scoring code" }
        count: { type: integer, minimum: 1 }
        points: { $ref: "#/components/schemas/Decimal" }
    RunRef:
      type: object
      required: [id, settings_sha256, voto_source, computed_at]
      properties:
        id: { type: string }
        settings_sha256: { type: string }
        voto_source: { type: string }
        computed_at: { type: string, format: date-time }
    Score:
      type: object
      required: [player, team, fixture_id, matchday, role, minutes, voto, fantavoto, senza_voto, voto_ufficio, stats, breakdown, run]
      properties:
        player: { $ref: "#/components/schemas/Ref" }
        team: { $ref: "#/components/schemas/Ref" }
        fixture_id: { type: string }
        matchday: { type: integer }
        role: { type: string, enum: [goalkeeper, outfield] }
        minutes: { type: integer }
        voto:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          nullable: true
          description: Base voto; null when senza voto.
        fantavoto:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          nullable: true
          description: voto plus the sum of the breakdown; null when senza voto.
        senza_voto: { type: boolean }
        voto_ufficio: { type: boolean, description: "The voto was assigned by a senza voto rule" }
        stats: { $ref: "#/components/schemas/PlayerMatchStats" }
        breakdown:
          type: array
          items: { $ref: "#/components/schemas/BreakdownItem" }
        run: { $ref: "#/components/schemas/RunRef" }
    PlayerMatchStats:
      type: object
      description: What the player did in the match, as derived from provider events. Shoot-outs never count.
      required: [goals, penalties_scored, penalties_missed, penalties_saved, own_goals, assists, yellow_cards, sent_off, goals_conceded, clean_sheet, assists_set_piece, assists_contribution, decisive_goals_win, decisive_goals_draw, player_of_the_match]
      properties:
        goals: { type: integer, minimum: 0, description: "Goals scored, excluding penalties" }
        penalties_scored: { type: integer, minimum: 0 }
        penalties_missed: { type: integer, minimum: 0, description: "Penalties taken and not scored, including those saved by the keeper" }
        penalties_saved: { type: integer, minimum: 0, description: "Penalties saved, as the goalkeeper" }
        own_goals: { type: integer, minimum: 0 }
        assists: { type: integer, minimum: 0, description: "Every assist class together" }
        assists_set_piece: { type: integer, minimum: 0, description: "Assists that came from a set piece. Part of assists; the rest are open play" }
        assists_contribution: { type: integer, minimum: 0, description: "Contributions to a goal that were not judged assists. Part of assists" }
        yellow_cards: { type: integer, minimum: 0, description: "Includes a second yellow" }
        sent_off: { type: boolean, description: "Sent off by a straight red or a second yellow" }
        goals_conceded: { type: integer, minimum: 0, description: "Goals the player's team conceded while the player was on the pitch, own goals included" }
        decisive_goals_win: { type: integer, minimum: 0, maximum: 1, description: "1 for the goal that put the winner ahead for good (the winner's goal number loser+1, regulation time, goals and penalty goals only; an own goal credits nobody)" }
        decisive_goals_draw: { type: integer, minimum: 0, maximum: 1, description: "1 for the last goal of a drawn match with goals, the one that levelled the score (regulation time; an own goal credits nobody)" }
        player_of_the_match: { type: boolean, description: "Named man of the match by the provider. Many fixtures have none" }
        clean_sheet: { type: boolean, description: "Goalkeeper who played and whose team conceded no goal while they were on the pitch. Whether it earned the bonus is in the breakdown (gk_clean_sheet): none when the voto is a voto d'ufficio or under the league's minimum minutes" }
    ScoreList:
      type: object
      required: [settings_sha256, voto_source, scores]
      properties:
        settings_sha256: { type: string }
        voto_source: { type: string }
        scores:
          type: array
          items: { $ref: "#/components/schemas/Score" }
        next_cursor: { $ref: "#/components/schemas/NextCursor" }
    Run:
      type: object
      required: [id, settings_sha256, voto_source, engine_version, input_hash, reason, created_at, current]
      properties:
        id: { type: string }
        settings_sha256: { type: string }
        voto_source: { type: string }
        engine_version: { type: string }
        input_hash: { type: string }
        supersedes: { type: string, nullable: true }
        reason: { type: string }
        created_at: { type: string, format: date-time }
        current: { type: boolean }
    Settings:
      type: object
      required: [sha256, body]
      properties:
        sha256: { type: string, description: "sha256 of the canonical JSON of body" }
        body:
          type: object
          additionalProperties: true
          description: The settings document; see internal/settings/schema/v1.json. Point values are integer hundredths.
