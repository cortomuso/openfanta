openapi: 3.0.3
info:
  title: OpenFanta API
  version: 0.1.0
  description: |
    Read-only access to fantacalcio voti and fantavoti computed by OpenFanta.

    Conventions:
    - IDs are opaque strings (UUIDs). Never rely on their structure.
    - Scores (`voto`, `fantavoto`, breakdown `points`) are **decimal strings with exactly two
      fractional digits**, such as `"6.38"` or `"7.00"`, so no client ever parses a float.
      `voto` is the provider rating unrounded; rounding is a league setting.
    - Rule set bodies are returned as published: point values there are integer hundredths.
    - Errors use RFC 9457 `application/problem+json`.
    - Responses carry an `ETag`; send `If-None-Match` to get `304 Not Modified`.
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: http://localhost:8080
tags:
  - name: health
  - name: scores
  - name: catalog
  - name: settings
paths:
  /healthz:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness probe
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /readyz:
    get:
      tags: [health]
      operationId: getReady
      summary: Readiness probe (checks the database)
      responses:
        "200":
          description: Ready to serve traffic.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          $ref: "#/components/responses/Problem"

  /v1/settings/default:
    get:
      tags: [settings]
      operationId: getDefaultSettings
      summary: Get the default league settings document (Classic)
      description: Scores are computed under this document until leagues score under their own.
      responses:
        "200":
          description: The document, in canonical JSON, with its hash.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }

  /v1/seasons:
    get:
      tags: [catalog]
      operationId: listSeasons
      summary: List seasons
      responses:
        "200":
          description: Seasons with ingested data.
          content:
            application/json:
              schema:
                type: object
                required: [seasons]
                properties:
                  seasons:
                    type: array
                    items: { $ref: "#/components/schemas/Season" }
  /v1/seasons/{seasonId}/matchdays:
    get:
      tags: [catalog]
      operationId: listMatchdays
      summary: List a season's matchdays and fixtures
      parameters:
        - $ref: "#/components/parameters/SeasonId"
      responses:
        "200":
          description: Matchdays in order.
          content:
            application/json:
              schema:
                type: object
                required: [season, matchdays]
                properties:
                  season: { $ref: "#/components/schemas/Season" }
                  matchdays:
                    type: array
                    items: { $ref: "#/components/schemas/Matchday" }
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/seasons/{seasonId}/matchdays/{number}/scores:
    get:
      tags: [scores]
      operationId: getMatchdayScores
      summary: Voti and fantavoti for every player of a matchday
      parameters:
        - $ref: "#/components/parameters/SeasonId"
        - { name: number, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - $ref: "#/components/parameters/VotoSourceQuery"
      responses:
        "200":
          description: Scores, ordered by fixture kickoff, team and player name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScoreList" }
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/seasons/{seasonId}/players/{playerId}/scores:
    get:
      tags: [scores]
      operationId: getPlayerSeasonScores
      summary: A player's voti and fantavoti across a season
      parameters:
        - $ref: "#/components/parameters/SeasonId"
        - $ref: "#/components/parameters/PlayerId"
        - $ref: "#/components/parameters/VotoSourceQuery"
      responses:
        "200":
          description: Scores ordered by matchday.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScoreList" }
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/fixtures/{fixtureId}/scores:
    get:
      tags: [scores]
      operationId: getFixtureScores
      summary: Voti and fantavoti for every player of a fixture
      parameters:
        - $ref: "#/components/parameters/FixtureId"
        - $ref: "#/components/parameters/VotoSourceQuery"
      responses:
        "200":
          description: Scores ordered by team and player name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScoreList" }
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/fixtures/{fixtureId}/runs:
    get:
      tags: [scores]
      operationId: getFixtureRuns
      summary: Audit trail of every computation of a fixture
      parameters:
        - $ref: "#/components/parameters/FixtureId"
      responses:
        "200":
          description: Runs, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [fixture, runs]
                properties:
                  fixture: { $ref: "#/components/schemas/Fixture" }
                  runs:
                    type: array
                    items: { $ref: "#/components/schemas/Run" }
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/players/{playerId}:
    get:
      tags: [catalog]
      operationId: getPlayer
      summary: Get a player
      parameters:
        - $ref: "#/components/parameters/PlayerId"
      responses:
        "200":
          description: The player.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ref" }
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"

components:
  parameters:
    SeasonId:
      { name: seasonId, in: path, required: true, schema: { type: string, format: uuid } }
    PlayerId:
      { name: playerId, in: path, required: true, schema: { type: string, format: uuid } }
    FixtureId:
      { name: fixtureId, in: path, required: true, schema: { type: string, format: uuid } }
    VotoSourceQuery:
      name: voto_source
      in: query
      description: Where base voti come from.
      schema: { type: string, default: provider-rating }
  responses:
    Problem:
      description: An error, as RFC 9457 problem details.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, example: ok }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, example: about:blank }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    Decimal:
      type: string
      pattern: "^-?[0-9]+\\.[0-9]{2}$"
      example: "6.38"
    Ref:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    Season:
      type: object
      required: [id, name, competition]
      properties:
        id: { type: string }
        name: { type: string, example: 2026/2027 }
        competition:
          type: object
          required: [id, name, country]
          properties:
            id: { type: string }
            name: { type: string }
            country: { type: string }
    Fixture:
      type: object
      required: [id, matchday, status, home, away]
      properties:
        id: { type: string }
        matchday: { type: integer }
        kickoff: { type: string, format: date-time, nullable: true }
        status: { type: string, description: "Provider status, e.g. FT" }
        home: { $ref: "#/components/schemas/Ref" }
        away: { $ref: "#/components/schemas/Ref" }
    Matchday:
      type: object
      required: [number, fixtures]
      properties:
        number: { type: integer }
        fixtures:
          type: array
          items: { $ref: "#/components/schemas/Fixture" }
    BreakdownItem:
      type: object
      required: [code, count, points]
      properties:
        code: { type: string, example: goal, description: "A scoring code" }
        count: { type: integer, minimum: 1 }
        points: { $ref: "#/components/schemas/Decimal" }
    RunRef:
      type: object
      required: [id, settings_sha256, voto_source, computed_at]
      properties:
        id: { type: string }
        settings_sha256: { type: string }
        voto_source: { type: string }
        computed_at: { type: string, format: date-time }
    Score:
      type: object
      required: [player, team, fixture_id, matchday, role, minutes, voto, fantavoto, senza_voto, voto_ufficio, stats, breakdown, run]
      properties:
        player: { $ref: "#/components/schemas/Ref" }
        team: { $ref: "#/components/schemas/Ref" }
        fixture_id: { type: string }
        matchday: { type: integer }
        role: { type: string, enum: [goalkeeper, outfield] }
        minutes: { type: integer }
        voto:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          nullable: true
          description: Base voto; null when senza voto.
        fantavoto:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          nullable: true
          description: voto plus the sum of the breakdown; null when senza voto.
        senza_voto: { type: boolean }
        voto_ufficio: { type: boolean, description: "The voto was assigned by a senza voto rule" }
        stats: { $ref: "#/components/schemas/PlayerMatchStats" }
        breakdown:
          type: array
          items: { $ref: "#/components/schemas/BreakdownItem" }
        run: { $ref: "#/components/schemas/RunRef" }
    PlayerMatchStats:
      type: object
      description: What the player did in the match, as derived from provider events. Shoot-outs never count.
      required: [goals, penalties_scored, penalties_missed, penalties_saved, own_goals, assists, yellow_cards, sent_off, goals_conceded]
      properties:
        goals: { type: integer, minimum: 0, description: "Goals scored, excluding penalties" }
        penalties_scored: { type: integer, minimum: 0 }
        penalties_missed: { type: integer, minimum: 0, description: "Penalties taken and not scored, including those saved by the keeper" }
        penalties_saved: { type: integer, minimum: 0, description: "Penalties saved, as the goalkeeper" }
        own_goals: { type: integer, minimum: 0 }
        assists: { type: integer, minimum: 0 }
        yellow_cards: { type: integer, minimum: 0, description: "Includes a second yellow" }
        sent_off: { type: boolean, description: "Sent off by a straight red or a second yellow" }
        goals_conceded: { type: integer, minimum: 0, description: "Goals the player's team conceded while the player was on the pitch, own goals included" }
    ScoreList:
      type: object
      required: [settings_sha256, voto_source, scores]
      properties:
        settings_sha256: { type: string }
        voto_source: { type: string }
        scores:
          type: array
          items: { $ref: "#/components/schemas/Score" }
    Run:
      type: object
      required: [id, settings_sha256, voto_source, engine_version, input_hash, reason, created_at, current]
      properties:
        id: { type: string }
        settings_sha256: { type: string }
        voto_source: { type: string }
        engine_version: { type: string }
        input_hash: { type: string }
        supersedes: { type: string, nullable: true }
        reason: { type: string }
        created_at: { type: string, format: date-time }
        current: { type: boolean }
    Settings:
      type: object
      required: [sha256, body]
      properties:
        sha256: { type: string, description: "sha256 of the canonical JSON of body" }
        body:
          type: object
          additionalProperties: true
          description: The settings document; see internal/settings/schema/v1.json. Point values are integer hundredths.
